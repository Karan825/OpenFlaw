name: Run Agent Worker
on:
  repository_dispatch:
    types: [trigger-agent]

jobs:
  run-agent:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r worker/requirements.txt
          pip install python-dotenv

      - name: Run Agent Worker
        env:
          # Injected trigger payload from webhook receiver
          PAYLOAD: ${{ github.event.client_payload.payload }}
          
          # Secrets configured in repository settings
          E2B_API_KEY: ${{ secrets.E2B_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          LLM_PROVIDER: "gemini"
          LLM_MODEL: "gemini-2.5-flash"
          
          # GitHub App Credentials (for git push and PR actions)
          GITHUB_APP_ID: ${{ secrets.APP_ID }}
          GITHUB_INSTALLATION_ID: ${{ secrets.INSTALLATION_ID }}
          GITHUB_APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
        run: |
          python worker/src/main.py
